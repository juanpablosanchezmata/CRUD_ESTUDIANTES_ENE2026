version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pablosm
      POSTGRES_PASSWORD: tu_password_seguro
      POSTGRES_DB: db_jenkins
    networks:
      - jenkins_jpsm
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          # Restricción para que solo corra en el nodo Worker-1
          - node.hostname == Worker-1
      restart_policy:
        condition: on-failure

  web:
    image: pablosanchezm/jenkins:latest
    ports:
      - "8080:5000"
    environment:
      # Conexión usando el nombre del servicio 'db'
      DATABASE_URL: postgresql://pablosm:tu_password_seguro@db:5432/db_jenkins
    networks:
      - jenkins-jpsm
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

networks:
  # La definimos como externa porque la crearemos en el script de shell
  jenkins-jpsm:
    external: true

volumes:
  db_data: